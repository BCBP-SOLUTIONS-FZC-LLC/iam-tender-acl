{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "tender-acl.fullname" . }}
  labels:
    {{- include "tender-acl.labels" . | nindent 4 }}
spec:
  # With minReplicas: 2 keep minAvailable=1 so a single node drain cannot
  # take the service to zero. Bump to 2 if scaling minReplicas to >=3.
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "tender-acl.selectorLabels" . | nindent 6 }}
{{- end }}
