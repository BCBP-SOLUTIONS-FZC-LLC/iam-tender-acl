{{- if and .Values.ingress.enabled (eq (.Values.ingress.type | default "Ingress") "HTTPRoute") }}
# Gateway API HTTPRoute — attach to an Envoy Gateway (or any Gateway API-
# compatible controller) by setting ingress.gateway.name in values.yaml.
#
# TLS termination is configured on the Gateway listener, not here.
# For CORS and gateway-level rate limiting, enable ingress.securityPolicy.
#
# Only routes /api/v1 (TAC-1..3). The internal, mTLS-only TAC-4 route
# (/internal/tenants/:id/tenders/:tender_id/acl/:user_id) is never exposed
# through this HTTPRoute — it is reached only via the service mesh, never
# through this Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "tender-acl.fullname" . }}
  labels:
    {{- include "tender-acl.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ required "ingress.gateway.name is required when ingress.type is HTTPRoute" .Values.ingress.gateway.name }}
      {{- with .Values.ingress.gateway.namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with .Values.ingress.gateway.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  {{- if .Values.ingress.hosts }}
  hostnames:
    {{- range .Values.ingress.hosts }}
    - {{ .host | quote }}
    {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    {{- range .paths }}
    - matches:
        - path:
            type: {{ .pathType | default "PathPrefix" }}
            value: {{ .path | quote }}
      backendRefs:
        - name: {{ include "tender-acl.fullname" $ }}
          port: {{ $.Values.service.httpPort }}
    {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
