# Prometheus alerting rules for the iam-tender-acl application.
#
# All tender_acl_* metrics are served on the dedicated :9090/metrics port
# (separate from the API port), so scraping never touches the API surface.
#
# Deploy via PrometheusRule CRD (kube-prometheus-stack) or include in a
# Prometheus --rule-files directory. The Helm chart renders an equivalent
# PrometheusRule at deploy/helm/tender-acl/templates/prometheusrule.yaml —
# this file is the source-of-truth "flat" version used by non-kube-
# prometheus setups. Alert thresholds/durations mirror LLD §14.5 exactly:
#
#   - /readyz fail > 5min                              → SEV-2 (critical)
#   - TAC-4 error rate > 10%/5min                       → SEV-2 (critical)
#   - iam-org-membership unreachable during TAC-2 > 15min → SEV-3 (warning)
#   - DLQ depth > 0                                     → SEV-3 (warning)
#
# Generic HTTP request metrics (used below by the TAC-4/overall error-rate
# alerts) are platform-gincommon's own http_requests_total, passed through
# as-is rather than duplicated under a tender_acl_* name (this service is
# not yet deployed, so making that switch had no live-dashboard migration
# cost). Labels:
#   method       — HTTP method
#   route        — matched route template (e.g. /api/v1/tenants/:id/tenders/:tender_id/acl)
#   status_class — "2xx"/"4xx"/"5xx"
#   error_class  — "success"/"client_error"/"server_error"
#
# Every alert carries:
#   severity: critical | warning — routes to PagerDuty (critical) or Jira (warning)

groups:
  # ── Availability ────────────────────────────────────────────────────────
  - name: tender_acl_availability
    rules:

      - alert: TenderAclDown
        expr: |
          absent(up{job="tender-acl"} == 1)
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: iam-tender-acl has no healthy/ready instances
          description: >-
            No tender-acl pods have been scraped as healthy for 5 minutes
            (LLD §14.5 SEV-2: /readyz fail > 5min). Check pod readiness:
            kubectl get pods -l app.kubernetes.io/name=tender-acl
          runbook: "iam-tender-acl/service-down"

      - alert: TenderAclReplicasMissing
        expr: |
          sum(up{job="tender-acl"}) < 2
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: iam-tender-acl running below minimum replica count
          description: >-
            Fewer than 2 replicas are healthy. HPA minReplicas is 2; a
            further disruption will block node drains.
            Current healthy count: {{ $value }}.

  # ── TAC-4 (live authorization path) error rate ──────────────────────────
  - name: tender_acl_errors
    rules:

      - alert: TenderAclTAC4HighErrorRate
        expr: |
          sum(rate(http_requests_total{job="tender-acl", route=~".*/internal/.*acl.*", error_class="server_error"}[5m]))
            /
          clamp_min(sum(rate(http_requests_total{job="tender-acl", route=~".*/internal/.*acl.*"}[5m])), 0.001)
          > 0.10
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: TAC-4 (authorization check) 5xx error rate above 10%
          description: >-
            {{ $value | humanizePercentage }} of TAC-4 requests are
            returning 5xx errors over the last 5 minutes (LLD §14.5 SEV-2).
            TAC-4 is on a live authorization decision path (Tender Service,
            AuthZ Enrichment) — investigate immediately.
          runbook: "iam-tender-acl/tac4-error-rate"

      - alert: TenderAclHighErrorRate
        expr: |
          sum(rate(http_requests_total{job="tender-acl", error_class="server_error"}[5m]))
            /
          clamp_min(sum(rate(http_requests_total{job="tender-acl"}[5m])), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: iam-tender-acl overall 5xx error rate above 5%
          description: >-
            {{ $value | humanizePercentage }} of all requests are returning
            5xx errors over the last 5 minutes. Investigate recent
            deployments, dependency health (Postgres, Valkey,
            iam-org-membership), and application logs.

  # ── Grant-time membership-check dependency (TAC-2 only) ─────────────────
  - name: tender_acl_membershipcheck
    rules:

      - alert: TenderAclMembershipCheckUnavailable
        # tender_acl_grant_checks_total{status="unavailable"} increments
        # only when the synchronous membershipcheck call to
        # iam-org-membership fails/times out (TAC-2, fail-closed —
        # TAC-FAIL-1). TAC-1/TAC-3/TAC-4 are unaffected (TAC-FAIL-3).
        expr: sum(rate(tender_acl_grant_checks_total{job="tender-acl", status="unavailable"}[5m])) > 0
        for: 15m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: iam-org-membership unreachable for TAC-2 grant-time membership checks
          description: >-
            The membershipcheck client has been failing/timing out for
            15+ minutes (LLD §14.5 SEV-3). New ACL grants are being
            blocked with 503 core_unavailable. Check iam-org-membership's
            health and the mesh path between the two services.
          runbook: "iam-tender-acl/membershipcheck-unavailable"

  # ── Tenant offboarding cascade (consumer) ────────────────────────────────
  - name: tender_acl_offboarding
    interval: 30s
    rules:

      - alert: TenderAclOffboardingCascadeFailing
        # The offboarding cascade is idempotent and safe to retry, so a
        # rising error rate means a persistent dependency failure, not
        # transient contention. A delayed/failed cascade is never a live
        # authz risk (TAC-EVT-4).
        expr: increase(tender_acl_tenant_offboarding_cascade_total{job="tender-acl", result="error"}[30m]) > 0
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "iam-tender-acl tenant offboarding cascade is failing"
          description: |
            One or more TenantOffboarded deliveries failed to complete the
            cascade delete of tender_acl_entries. Since the idempotency
            record is only written after success, the message stays on
            tenant-lifecycle-tenderacl-q for redelivery — check consumer
            logs for the underlying Postgres error, and watch for messages
            approaching maxReceiveCount=5 (which routes to
            tenant-lifecycle-tenderacl-q-dlq).
          runbook: "iam-tender-acl/offboarding-cascade-failing"

      - alert: TenderAclOffboardingDLQGrowing
        # Requires the sqs_exporter (or CloudWatch exporter) series
        # aws_sqs_approximate_number_of_messages_visible; not emitted by
        # this application itself.
        expr: aws_sqs_approximate_number_of_messages_visible{queue_name="tenant-lifecycle-tenderacl-q-dlq"} > 0
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "tenant-lifecycle-tenderacl-q-dlq has messages"
          description: |
            {{ $value }} message(s) on the dead-letter queue (LLD §14.5
            SEV-3). Each one is a TenantOffboarded delivery that failed 5
            consecutive processing attempts. Inspect the DLQ payloads and,
            once the underlying issue is fixed, redrive them back to
            tenant-lifecycle-tenderacl-q.
          runbook: "iam-tender-acl/offboarding-dlq-growing"

  # ── Per-user-removal ACL cascade (consumer) — ADR-0007 Wave 3 Phase 3 ────
  - name: tender_acl_member_removal
    interval: 30s
    rules:

      - alert: TenderAclMemberRemovalCascadeFailing
        # Same reasoning as TenderAclOffboardingCascadeFailing: this
        # cascade is idempotent and safe to retry, and a delayed/failed
        # cascade is never a live authz risk (TAC-EVT-4-style framing — a
        # removed user can't present valid gateway-injected headers again
        # regardless).
        expr: increase(tender_acl_member_removal_cascade_total{job="tender-acl", result="error"}[30m]) > 0
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "iam-tender-acl member removal ACL cascade is failing"
          description: |
            One or more TenantMembershipRemoved deliveries failed to
            complete the soft-delete of that user's tender_acl_entries
            rows. Since the idempotency record is only written after
            success, the message stays on member-removal-tenderacl-q for
            redelivery — check consumer logs for the underlying Postgres
            error, and watch for messages approaching maxReceiveCount=5
            (which routes to member-removal-tenderacl-q-dlq).
          runbook: "iam-tender-acl/member-removal-cascade-failing"

      - alert: TenderAclMemberRemovalDLQGrowing
        expr: aws_sqs_approximate_number_of_messages_visible{queue_name="member-removal-tenderacl-q-dlq"} > 0
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "member-removal-tenderacl-q-dlq has messages"
          description: |
            {{ $value }} message(s) on the dead-letter queue. Each one is a
            TenantMembershipRemoved delivery that failed 5 consecutive
            processing attempts. Inspect the DLQ payloads and, once the
            underlying issue is fixed, redrive them back to
            member-removal-tenderacl-q.
          runbook: "iam-tender-acl/member-removal-dlq-growing"
