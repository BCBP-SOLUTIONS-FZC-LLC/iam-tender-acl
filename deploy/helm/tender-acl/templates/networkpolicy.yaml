{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tender-acl.fullname" . }}
  labels:
    {{- include "tender-acl.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "tender-acl.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Allow API traffic from the ingress controller / gateway namespace —
    # both the public TAC-1..3 routes and the internal, mTLS-only TAC-4
    # route are served on the same "http" port.
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressControllerNamespaceSelector | nindent 14 }}
          {{- with .Values.networkPolicy.ingressControllerPodSelector }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      ports:
        - port: {{ .Values.service.httpPort }}
          protocol: TCP

    # Allow internal service-to-service traffic within the same namespace,
    # for callers of the internal TAC-4 authorization-check route (Tender
    # Service, AuthZ Enrichment).
    - from:
        - podSelector: {}
      ports:
        - port: {{ .Values.service.httpPort }}
          protocol: TCP

    # Allow Prometheus to scrape :9090/metrics — restricted to the
    # monitoring namespace. Metrics live on a SEPARATE port from the API,
    # so this rule (unlike the two above) does not grant any API access.
    {{- if .Values.networkPolicy.metricsIngress.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.metricsIngress.namespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.metricsIngress.podSelector | nindent 14 }}
      ports:
        - port: {{ .Values.service.metricsPort }}
          protocol: TCP
    {{- end }}

    {{- with .Values.networkPolicy.additionalIngressRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}

  egress:
    # Allow DNS resolution (required for all outbound connections, including
    # cluster-DNS lookups of Postgres/Valkey/iam-org-membership).
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

    # Allow HTTPS to AWS regional endpoints (SQS only — this service
    # publishes zero events, so no SNS; no Glue, no S3, no KMS).
    - ports:
        - port: 443
          protocol: TCP

    # Allow PostgreSQL connections. Container-internal port 5432.
    - ports:
        - port: 5432
          protocol: TCP

    # Allow Valkey (Redis-protocol) connections.
    - ports:
        - port: 6379
          protocol: TCP

    # Allow HTTP to iam-org-membership (the membershipcheck grant-time
    # dependency, LLD §7.6.2) via cluster DNS. This is the one addition
    # vs. iam-group-mapping's NetworkPolicy — the synchronous outbound
    # call this service makes that its sibling does not.
    - ports:
        - port: 8080
          protocol: TCP

    # Allow OTel OTLP/HTTP to the collector (otlptracehttp; note this is
    # 4318, not the gRPC default of 4317).
    - ports:
        - port: 4318
          protocol: TCP

    {{- with .Values.networkPolicy.additionalEgressRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
